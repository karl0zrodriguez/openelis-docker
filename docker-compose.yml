services:
  # Base de datos (Sin container_name, Sin ports externos)
  db.openelis.org:
    image: postgres:10-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=adminADMIN!
      - POSTGRES_DB=openelis
    volumes:
      - openelis_db_data:/var/lib/postgresql/data

  # Backend (Sin container_name, Sin ports)
  oe.openelis.org:
    image: itechuw/openelis-global-2:develop
    restart: always
    environment:
      - DB_URL=jdbc:postgresql://db.openelis.org:5432/openelis
      - DB_USER=postgres
      - DB_PASSWORD=adminADMIN!
    depends_on:
      - db.openelis.org

  # Proxy (Sin container_name, Puerto modificado)
  proxy:
    image: nginx:alpine
    restart: always
    # Aquí mapeamos el 9080 externo al 80 interno del contenedor
    ports:
      - "9080:80"
    depends_on:
      - oe.openelis.org
    # ... (resto de tu configuración de volúmenes o links)

# Definición de volúmenes al final
volumes:
  openelis_db_data:
